

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users | QuizMaster</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-category-page">

    <div class="category-admin-container">

        <div class="category-admin-header">
            <div>
                <h2>Registered Users</h2>
                <p>View all users registered in the quiz system.</p>
            </div>
            <a href="index.html" class="admin-back-link">Back to Home</a>
        </div>

        <div class="category-form-card question-table-card">

            <h3>User Details</h3>

            <div class="admin-table-wrapper">
                <table class="admin-category-table">
                    <thead>
                        <tr>
                            <th>Sl No.</th>
                            <th>Full Name</th>
                            <th>Email Address</th>
                            <th>Registration Date</th>
                        </tr>
                    </thead>

                    <tbody id="registeredUsersTable">
                        <tr>
                            <td colspan="4">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result - QuizMaster</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="result-page">

    <header class="profile-navbar">

        <div class="login-logo">
            <span>✓</span>
            <h2>QuizMaster</h2>
        </div>

        <a href="categories.html" class="back-home">
            Back to Categories
        </a>

    </header>


    <main class="result-container">

        <div class="result-card">

            <div class="result-icon">🏆</div>

            <h1>Quiz Completed!</h1>

            <p class="result-subtitle">
                Here is your quiz performance
            </p>

            <div class="score-circle">
                <h2 id="score">0/3</h2>
                <p>Your Score</p>
            </div>

            <h3 id="resultMessage">Good Job!</h3>

            <p class="result-description">
                Keep practicing to improve your knowledge.
            </p>

            <a href="categories.html" class="result-btn">
                Try Another Quiz
            </a>

            <a href="index.html" class="result-home">
                Back to Home
            </a>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>

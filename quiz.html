

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Quiz - QuizMaster</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="quiz-page">

    <header class="profile-navbar">

        <div class="login-logo">
            <span>✓</span>
            <h2>QuizMaster</h2>
        </div>

        <a href="categories.html" class="back-home">
            ← Back to Categories
        </a>

    </header>

    <main class="quiz-container">

        <div class="quiz-heading">
            <h1 id="quizCategoryTitle">Loading Quiz...</h1>
            <p>Choose the correct answer for each question</p>
        </div>

        <div class="quiz-card">

            <div id="questionList">
                <p>Loading questions...</p>
            </div>

            <button type="button" class="submit-quiz" id="submitQuiz">
                Submit Quiz
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
